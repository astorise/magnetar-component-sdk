schema: spec-driven

context: |
  magnetar-component-sdk is part of Magnetar (https://github.com/astorise/Magnetar), a Rust-first
  local AI Runtime. The shared crate Model Components build on: the graph description, the `GraphSink`
  and its adapter to the contract's bindings, and a recording test double. Its specifications and
  changes live in this repository. A change that also reaches the Magnetar core is coordinated by a
  change of the same name in Magnetar, which links to the companion change here.
